<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>florr-auto-pathing 控制面板</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 16px; }
  h1 { font-size: 18px; }
  h2 { font-size: 14px; color: #9ad; margin: 16px 0 8px; }
  .boxes { display: flex; gap: 16px; flex-wrap: wrap; }
  .box { background: #262626; border-radius: 8px; padding: 12px; flex: 1; min-width: 280px; }
  .box h2 { margin-top: 0; }
  .unit { display: flex; justify-content: space-between; padding: 2px 0; font-size: 13px; }
  .unit .active { color: #6c6; }
  .unit .inactive { color: #999; }
  .unit .failed { color: #e66; }
  button { background: #345; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 4px; }
  button:hover { background: #456; }
  textarea { width: 100%; height: 300px; background: #111; color: #ddd; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  #login { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; }
  #login input { padding: 8px; font-size: 14px; }
  .hidden { display: none !important; }
  #errors { white-space: pre-wrap; font-size: 12px; color: #e66; }
  #log { background: #000; color: #9c9; font-family: monospace; font-size: 12px; height: 200px; overflow-y: auto; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="login">
  <div>
    <p>输入面板密码：</p>
    <input type="password" id="password-input" autofocus>
    <button id="password-submit">进入</button>
  </div>
</div>

<div id="app" class="hidden">
  <h1>florr-auto-pathing 控制面板</h1>
  <div class="boxes" id="boxes"></div>

  <h2>config.json</h2>
  <textarea id="config-text"></textarea>
  <div id="errors"></div>
  <button id="config-save">保存</button>

  <h2>日志（本机 florr-bot）</h2>
  <div id="log"></div>
</div>

<script>
const SELF_ORIGIN = window.location.origin;
let TOKEN = localStorage.getItem("florr_webctl_token") || "";
let PEER_ORIGIN = "";

function authHeaders() {
  return { "Authorization": "Bearer " + TOKEN };
}

async function apiGet(origin, path) {
  const resp = await fetch(origin + path, { headers: authHeaders() });
  if (resp.status === 401) {
    localStorage.removeItem("florr_webctl_token");
    location.reload();
    throw new Error("未授权");
  }
  return resp;
}

function renderBox(container, origin, label, status) {
  let html = `<h2>${label}</h2>`;
  if (!status) {
    html += `<p style="color:#e66">无法连接</p>`;
  } else {
    html += `<div>内存: ${status.memory.mem_used_mb ?? "?"} / ${status.memory.mem_total_mb ?? "?"} MB</div>`;
    html += `<div>Swap: ${status.memory.swap_used_mb ?? "?"} / ${status.memory.swap_total_mb ?? "?"} MB</div>`;
    for (const [unit, state] of Object.entries(status.units)) {
      const cls = state === "active" ? "active" : (state === "failed" ? "failed" : "inactive");
      html += `<div class="unit"><span>${unit}</span><span class="${cls}">${state}</span></div>`;
    }
    html += status.active_block
      ? `<div>当前时块: ${status.active_block.id}（${status.active_block.map}）</div>`
      : `<div>当前没有生效的时块</div>`;
    html += `<div style="margin-top:8px">
      <button data-action="start">启动</button>
      <button data-action="stop">停止</button>
      <button data-action="restart">重启</button>
    </div>`;
  }
  container.innerHTML = html;
  container.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", () => control(origin, btn.dataset.action));
  });
}

async function control(origin, action) {
  await fetch(origin + "/api/control/" + action, { method: "POST", headers: authHeaders() });
  refreshStatus();
}

async function refreshStatus() {
  const boxes = document.getElementById("boxes");
  boxes.innerHTML = "";
  const selfBox = document.createElement("div");
  selfBox.className = "box";
  boxes.appendChild(selfBox);

  try {
    const resp = await apiGet(SELF_ORIGIN, "/api/status");
    const status = await resp.json();
    PEER_ORIGIN = status.peer_url || "";
    renderBox(selfBox, SELF_ORIGIN, "本机（" + SELF_ORIGIN + "）", status);
  } catch (e) {
    renderBox(selfBox, SELF_ORIGIN, "本机", null);
  }

  if (PEER_ORIGIN) {
    const peerBox = document.createElement("div");
    peerBox.className = "box";
    boxes.appendChild(peerBox);
    try {
      const resp = await fetch(PEER_ORIGIN + "/api/status", { headers: authHeaders() });
      const status = await resp.json();
      renderBox(peerBox, PEER_ORIGIN, "对端（" + PEER_ORIGIN + "）", status);
    } catch (e) {
      renderBox(peerBox, PEER_ORIGIN, "对端（" + PEER_ORIGIN + "）", null);
    }
  }
}

async function loadConfig() {
  const resp = await apiGet(SELF_ORIGIN, "/api/config");
  const text = await resp.text();
  document.getElementById("config-text").value = JSON.stringify(JSON.parse(text), null, 2);
}

async function saveConfig() {
  const errorsEl = document.getElementById("errors");
  errorsEl.style.color = "#e66";
  errorsEl.textContent = "";
  const text = document.getElementById("config-text").value;
  const resp = await fetch(SELF_ORIGIN + "/api/config", {
    method: "POST", headers: authHeaders(), body: text
  });
  // resp.json() 在非 JSON 响应体(比如没被这次修复覆盖到的某个 500 场景, 或者
  // 反代/浏览器自己生成的错误页)上会 reject —— 之前没 try/catch, 那个 reject
  // 会让整个函数在这里静默中断, "已保存"/错误信息都不会出现, 用户点了保存跟
  // 没点一样。
  let body = null;
  try { body = await resp.json(); } catch {}
  if (!resp.ok) {
    errorsEl.textContent = body?.errors?.join("\n") ?? body?.error ?? (resp.status + " " + resp.statusText);
    return;
  }
  errorsEl.style.color = "#6c6";
  errorsEl.textContent = "已保存";
}

function startLogStream() {
  const logEl = document.getElementById("log");
  const es = new EventSource(SELF_ORIGIN + "/api/logs/stream?token=" + encodeURIComponent(TOKEN));
  es.onmessage = (e) => {
    logEl.textContent += e.data + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  };
  // EventSource 断线(网络问题/服务重启/401)以前完全没有反馈 —— 日志区就那样
  // 停在最后一行, 看不出是"日志说完了"还是"连接掉了"。
  es.onerror = () => {
    logEl.textContent += "[日志流断开]\n";
    logEl.scrollTop = logEl.scrollHeight;
  };
}

function enterApp() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  // 三个调用以前都是又不 await 又不 catch —— 任何一个 reject 都会是完全静默的
  // unhandled rejection, 界面上什么反馈都没有(refreshStatus 自己内部已经用
  // try/catch 渲染了"无法连接", 这里的 catch 主要兜 loadConfig 意外抛出的情况,
  // 比如 /api/config 返回的不是合法 JSON)。
  refreshStatus().catch((e) => console.error("refreshStatus 失败", e));
  loadConfig().catch((e) => console.error("loadConfig 失败", e));
  startLogStream();
  setInterval(refreshStatus, 10000);
}

document.getElementById("password-submit").addEventListener("click", () => {
  TOKEN = document.getElementById("password-input").value;
  localStorage.setItem("florr_webctl_token", TOKEN);
  enterApp();
});
document.getElementById("config-save").addEventListener("click", saveConfig);

if (TOKEN) {
  enterApp();
}
</script>
</body>
</html>
